[project]
name = "urban-reflex"
version = "0.1.0"
description = "Add your description here"
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.121.2",
    "motor>=3.7.1",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
    "google-generativeai>=0.8.3",
    "embed-anything>=0.3.0",
    "beautifulsoup4>=4.12.3",
    "requests>=2.32.3",
    "aiohttp>=3.11.2",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.4",
    "sentence-transformers>=3.3.1",
    "pinecone>=5.0.0",
    "geojson>=3.1.0",
    "jsonschema>=4.20.0",
    "python-dateutil>=2.8.2",
    "shapely>=2.0.2",
    "tqdm>=4.66.1",
    "pandas>=2.1.4",
    "APScheduler>=3.10.4",
]

[project.optional-dependencies]
dev = [
    "black>=24.1.1",
    "flake8>=7.0.0",
    "isort>=5.13.2",
    "pre-commit>=4.5.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "E266", "E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".eggs",
    "*.egg",
    "build",
    "dist",
]

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["src"]
