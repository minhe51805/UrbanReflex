# Pre-commit hooks configuration
# Runs before each commit to check code quality

# Update hooks: pre-commit autoupdate

repos:
  # Local Python tools (already installed via pip)
  - repo: local
    hooks:
      # Python code formatting with Black
      - id: black
        name: black
        entry: black
        language: python
        types: [python]
        args: ['--line-length=100']

      # Import sorting with isort
      - id: isort
        name: isort
        entry: isort
        language: python
        types: [python]
        args: ['--profile=black', '--line-length=100']

      # Python linting with Flake8
      - id: flake8
        name: flake8
        entry: flake8
        language: python
        types: [python]
        args: ['--max-line-length=100', '--extend-ignore=E203,E266,E501,W503']

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Prevent giant files from being committed
      - id: check-added-large-files
        args: ['--maxkb=1000']
      # Check for files that parse as invalid YAML
      - id: check-yaml
      # Check for files that parse as invalid JSON
      - id: check-json
      # Check for merge conflicts
      - id: check-merge-conflict
      # Trim trailing whitespace
      - id: trailing-whitespace
        args: [--markdown-args=<blank line>]
      # Fix end of file newline
      - id: end-of-file-fixer
      # Check for debugger imports and py37+
      - id: debug-statements
      # Ensure files parse as valid Python
      - id: check-ast
      # Validate Python syntax
      - id: check-toml

# Configure which files to check
default_language_version:
  python: python3.10

# Files to exclude
exclude: |
  (?x)^(
    venv/|
    \.venv/|
    __pycache__/|
    \.eggs/|
    \.git/|
    \.github/|
    node_modules/|
    \.next/|
    build/|
    dist/|
    \.pytest_cache/|
    \.mypy_cache/|
  )
